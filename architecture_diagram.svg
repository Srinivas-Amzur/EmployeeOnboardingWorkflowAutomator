  <text x="134" y="689" text-anchor="middle" font-size="8" fill="#e2e8f0">Welcome · Docs emails</text>

  <rect x="226" y="664" width="164" height="28" rx="5" fill="#475569"/>
  <text x="308" y="678" text-anchor="middle" font-size="9" font-weight="600" fill="white">Google OAuth 2.0</text>
  <text x="308" y="689" text-anchor="middle" font-size="8" fill="#e2e8f0">SSO Login flow</text>

  <rect x="400" y="664" width="210" height="28" rx="5" fill="#475569"/>
  <text x="505" y="678" text-anchor="middle" font-size="9" font-weight="600" fill="white">LiteLLM Proxy Gateway</text>
  <text x="505" y="689" text-anchor="middle" font-size="8" fill="#e2e8f0">Gemini 2.5 Flash · GPT-4o</text>

  <rect x="620" y="664" width="164" height="28" rx="5" fill="#475569"/>
  <text x="702" y="678" text-anchor="middle" font-size="9" font-weight="600" fill="white">Google Drive</text>
  <text x="702" y="689" text-anchor="middle" font-size="8" fill="#e2e8f0">Onboarding document links</text>

  <rect x="794" y="664" width="130" height="28" rx="5" fill="#475569"/>
  <text x="859" y="678" text-anchor="middle" font-size="9" font-weight="600" fill="white">Docker Compose</text>
  <text x="859" y="689" text-anchor="middle" font-size="8" fill="#e2e8f0">Local orchestration</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
