  <rect x="52" y="220" width="124" height="56" rx="6" fill="#7c3aed"/>
  <text x="114" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">Auth</text>
  <text x="114" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">JWT Cookie</text>
  <text x="114" y="268" text-anchor="middle" font-size="8" fill="#ddd6fe">Google OAuth</text>

  <rect x="186" y="220" width="124" height="56" rx="6" fill="#7c3aed"/>
  <text x="248" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">Employees</text>
  <text x="248" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">CRUD · Search</text>
  <text x="248" y="268" text-anchor="middle" font-size="8" fill="#ddd6fe">RBAC gated</text>

  <rect x="320" y="220" width="124" height="56" rx="6" fill="#7c3aed"/>
  <text x="382" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">Onboarding</text>
  <text x="382" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">Workflows · Tasks</text>
  <text x="382" y="268" text-anchor="middle" font-size="8" fill="#ddd6fe">Meetings</text>

  <rect x="454" y="220" width="124" height="56" rx="6" fill="#7c3aed"/>
  <text x="516" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">Notifications</text>
  <text x="516" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">List · Read</text>
  <text x="516" y="268" text-anchor="middle" font-size="8" fill="#ddd6fe">Unread Count</text>

  <rect x="588" y="220" width="124" height="56" rx="6" fill="#7c3aed"/>
  <text x="650" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">Analytics</text>
  <text x="650" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">Dashboard Stats</text>
  <text x="650" y="268" text-anchor="middle" font-size="8" fill="#ddd6fe">Reports · Export</text>

  <rect x="722" y="220" width="124" height="56" rx="6" fill="#7c3aed"/>
  <text x="784" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">RAG / AI</text>
  <text x="784" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">Upload · Query</text>
  <text x="784" y="268" text-anchor="middle" font-size="8" fill="#ddd6fe">Chat History</text>

  <rect x="856" y="220" width="68" height="56" rx="6" fill="#7c3aed"/>
  <text x="890" y="241" text-anchor="middle" font-size="9" font-weight="600" fill="white">Audit</text>
  <text x="890" y="255" text-anchor="middle" font-size="8" fill="#ddd6fe">Logs</text>

  <!-- Arrow: API to Services -->
  <line x1="486" y1="292" x2="486" y2="316" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-violet)"/>

  <!-- LAYER 3 — SERVICES -->
  <rect x="36" y="316" width="900" height="192" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="486" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">SERVICE LAYER — Business Logic (Python / SQLAlchemy Async)</text>

  <rect x="52" y="346" width="128" height="64" rx="6" fill="#16a34a"/>
  <text x="116" y="366" text-anchor="middle" font-size="9" font-weight="600" fill="white">EmployeeService</text>
  <text x="116" y="380" text-anchor="middle" font-size="8" fill="#bbf7d0">Create · Update</text>
  <text x="116" y="393" text-anchor="middle" font-size="8" fill="#bbf7d0">company_email gen</text>

  <rect x="190" y="346" width="128" height="64" rx="6" fill="#16a34a"/>
  <text x="254" y="366" text-anchor="middle" font-size="9" font-weight="600" fill="white">OnboardingService</text>
  <text x="254" y="380" text-anchor="middle" font-size="8" fill="#bbf7d0">Workflow CRUD</text>
  <text x="254" y="393" text-anchor="middle" font-size="8" fill="#bbf7d0">Task · Meeting Mgmt</text>

  <rect x="328" y="346" width="128" height="64" rx="6" fill="#16a34a"/>
  <text x="392" y="366" text-anchor="middle" font-size="9" font-weight="600" fill="white">NotificationSvc</text>
  <text x="392" y="380" text-anchor="middle" font-size="8" fill="#bbf7d0">In-app + Email</text>
  <text x="392" y="393" text-anchor="middle" font-size="8" fill="#bbf7d0">Welcome · Docs email</text>

  <rect x="466" y="346" width="128" height="64" rx="6" fill="#16a34a"/>
  <text x="530" y="366" text-anchor="middle" font-size="9" font-weight="600" fill="white">AnalyticsService</text>
  <text x="530" y="380" text-anchor="middle" font-size="8" fill="#bbf7d0">Dashboard Stats</text>
  <text x="530" y="393" text-anchor="middle" font-size="8" fill="#bbf7d0">Sequential queries</text>

  <rect x="604" y="346" width="128" height="64" rx="6" fill="#16a34a"/>
  <text x="668" y="366" text-anchor="middle" font-size="9" font-weight="600" fill="white">AuthService</text>
  <text x="668" y="380" text-anchor="middle" font-size="8" fill="#bbf7d0">JWT · bcrypt</text>
  <text x="668" y="393" text-anchor="middle" font-size="8" fill="#bbf7d0">Google OAuth flow</text>

  <rect x="742" y="346" width="180" height="64" rx="6" fill="#16a34a"/>
  <text x="832" y="366" text-anchor="middle" font-size="9" font-weight="600" fill="white">AuditService</text>
  <text x="832" y="380" text-anchor="middle" font-size="8" fill="#bbf7d0">Action Logs</text>
  <text x="832" y="393" text-anchor="middle" font-size="8" fill="#bbf7d0">RBAC filtered</text>

  <rect x="52" y="424" width="200" height="68" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="152" y="444" text-anchor="middle" font-size="9" font-weight="700" fill="white">LangGraph Orchestrator</text>
  <text x="152" y="458" text-anchor="middle" font-size="8" fill="#6ee7b7">Deterministic State Machine</text>
  <text x="152" y="471" text-anchor="middle" font-size="8" fill="#6ee7b7">hr_review → provisioning →</text>
  <text x="152" y="484" text-anchor="middle" font-size="8" fill="#6ee7b7">meetings → docs → completed</text>

  <rect x="262" y="424" width="160" height="68" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="342" y="444" text-anchor="middle" font-size="9" font-weight="600" fill="white">OrchestrationService</text>
  <text x="342" y="460" text-anchor="middle" font-size="8" fill="#6ee7b7">Task Blueprint Gen</text>
  <text x="342" y="473" text-anchor="middle" font-size="8" fill="#6ee7b7">State Advancement</text>
  <text x="342" y="486" text-anchor="middle" font-size="8" fill="#6ee7b7">Event Logging</text>

  <rect x="432" y="424" width="200" height="68" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="532" y="444" text-anchor="middle" font-size="9" font-weight="700" fill="white">RAG Pipeline</text>
  <text x="532" y="458" text-anchor="middle" font-size="8" fill="#6ee7b7">PDF → Chunk → Embed</text>
  <text x="532" y="471" text-anchor="middle" font-size="8" fill="#6ee7b7">ChromaDB Retrieve</text>
  <text x="532" y="484" text-anchor="middle" font-size="8" fill="#6ee7b7">LangChain LCEL Chain</text>

  <rect x="642" y="424" width="280" height="68" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="782" y="444" text-anchor="middle" font-size="9" font-weight="700" fill="white">LLM Layer — LiteLLM Proxy</text>
  <text x="782" y="460" text-anchor="middle" font-size="8" fill="#6ee7b7">gemini-2.5-flash (fast) · gpt-4o (advanced)</text>
  <text x="782" y="473" text-anchor="middle" font-size="8" fill="#6ee7b7">text-embedding-3-large (embeddings)</text>
  <text x="782" y="486" text-anchor="middle" font-size="8" fill="#6ee7b7">LangChain ChatOpenAI client</text>

  <!-- Arrows: Services to Data -->
  <line x1="300" y1="508" x2="300" y2="530" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="650" y1="508" x2="650" y2="530" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- LAYER 4 — DATA -->
  <rect x="36" y="528" width="900" height="100" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="486" y="547" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">DATA LAYER</text>

  <rect x="52" y="558" width="340" height="56" rx="6" fill="#d97706"/>
  <text x="222" y="579" text-anchor="middle" font-size="9" font-weight="700" fill="white">PostgreSQL (Supabase) — Primary Store</text>
  <text x="222" y="594" text-anchor="middle" font-size="8" fill="#fef3c7">users · employees · workflows · tasks · meetings · notifications · audit_logs</text>
  <text x="222" y="607" text-anchor="middle" font-size="8" fill="#fef3c7">asyncpg + NullPool · Alembic migrations · RBAC-aware queries</text>

  <rect x="402" y="558" width="240" height="56" rx="6" fill="#d97706"/>
  <text x="522" y="579" text-anchor="middle" font-size="9" font-weight="700" fill="white">ChromaDB — Vector Store</text>
  <text x="522" y="594" text-anchor="middle" font-size="8" fill="#fef3c7">Per-user collections: user_{id}</text>
  <text x="522" y="607" text-anchor="middle" font-size="8" fill="#fef3c7">Semantic retrieval for RAG</text>

  <rect x="652" y="558" width="272" height="56" rx="6" fill="#b45309"/>
  <text x="788" y="579" text-anchor="middle" font-size="9" font-weight="700" fill="white">Schema Management</text>
  <text x="788" y="594" text-anchor="middle" font-size="8" fill="#fef3c7">Alembic migrations (8 versions)</text>
  <text x="788" y="607" text-anchor="middle" font-size="8" fill="#fef3c7">25 performance indexes (migration 008)</text>

  <!-- LAYER 5 — EXTERNAL -->
