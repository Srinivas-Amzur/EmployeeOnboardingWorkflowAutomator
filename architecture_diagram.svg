<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" width="960" height="720" font-family="system-ui, -apple-system, sans-serif">
  <title>Employee Onboarding Workflow Automator — Architecture Diagram</title>
  <desc>System architecture showing frontend, backend, AI, database, and external service layers</desc>

  <!-- Background -->
  <rect width="960" height="720" fill="#f8f9fc"/>

  <!-- LAYER LABELS -->
  <text x="18" y="108" font-size="10" fill="#94a3b8" font-weight="600" transform="rotate(-90,18,108)" text-anchor="middle">CLIENT</text>
  <text x="18" y="252" font-size="10" fill="#94a3b8" font-weight="600" transform="rotate(-90,18,252)" text-anchor="middle">API</text>
  <text x="18" y="420" font-size="10" fill="#94a3b8" font-weight="600" transform="rotate(-90,18,420)" text-anchor="middle">SERVICES</text>
  <text x="18" y="570" font-size="10" fill="#94a3b8" font-weight="600" transform="rotate(-90,18,570)" text-anchor="middle">DATA</text>
  <text x="18" y="670" font-size="10" fill="#94a3b8" font-weight="600" transform="rotate(-90,18,670)" text-anchor="middle">EXTERNAL</text>

  <!-- LAYER 1 — FRONTEND -->
  <rect x="36" y="24" width="900" height="148" rx="10" fill="#f0f4ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="486" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca">FRONTEND — React 18 + TypeScript + Vite</text>

  <rect x="52" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="110" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">Dashboard</text>
  <text x="110" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">KPIs · Pipeline</text>

  <rect x="178" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="236" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">Workflows</text>
  <text x="236" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">List · Detail</text>

  <rect x="304" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="362" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">New Employee</text>
  <text x="362" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">Create · Onboard</text>

  <rect x="430" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="488" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">Notifications</text>
  <text x="488" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">In-app · Real-time</text>

  <rect x="556" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="614" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">Analytics</text>
  <text x="614" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">Recharts · CSV/PDF</text>

  <rect x="682" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="740" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">AI Assistant</text>
  <text x="740" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">RAG Chat · Upload</text>

  <rect x="808" y="56" width="116" height="50" rx="6" fill="#6366f1"/>
  <text x="866" y="77" text-anchor="middle" font-size="9" font-weight="600" fill="white">Employee Portal</text>
  <text x="866" y="91" text-anchor="middle" font-size="8" fill="#c7d2fe">Self-service View</text>

  <rect x="52" y="116" width="274" height="44" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="189" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#3730a3">TanStack Query</text>
  <text x="189" y="147" text-anchor="middle" font-size="8" fill="#4338ca">Server-state · Polling · Mutations</text>

  <rect x="336" y="116" width="180" height="44" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="426" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#3730a3">Zustand</text>
  <text x="426" y="147" text-anchor="middle" font-size="8" fill="#4338ca">Auth Store · UI State</text>

  <rect x="526" y="116" width="180" height="44" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="616" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#3730a3">Axios Client</text>
  <text x="616" y="147" text-anchor="middle" font-size="8" fill="#4338ca">HTTP-only Cookie Auth</text>

  <rect x="716" y="116" width="220" height="44" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="826" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#3730a3">React Router v6</text>
  <text x="826" y="147" text-anchor="middle" font-size="8" fill="#4338ca">Protected Routes · RBAC Guards</text>

  <!-- Arrow: Frontend to API -->
  <line x1="486" y1="172" x2="486" y2="192" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="500" y="185" font-size="9" fill="#6366f1">REST / JSON</text>

